services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_DATABASE: ${DB_NAME:-fruit_ripeness}
    ports: ["3306:3306"]
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  ml:
    build: ./ml-service
    environment:
      MODEL_PATH: /app/models/best.pt
      FALLBACK_MODEL: /app/models/yolov8l.pt
    volumes:
      - ./ml-service/models:/app/models
    ports: ["5001:5001"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 15s
      retries: 10
      start_period: 90s

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_started }
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${DB_NAME:-fruit_ripeness}
      ML_SERVICE_URL: http://ml:5001
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_DIR: /frontend
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/frontend:ro

volumes:
  db_data:
